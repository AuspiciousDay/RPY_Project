
name: "문서 작업"
description: "문서 작성, 수정 및 관리 작업을 등록합니다."
title: "[DOCS] "
labels: ["documentation"]

body:
  - type: dropdown
    id: document_type
    attributes:
      label: "문서 작업 유형"
      description: "어떤 종류의 문서 작업인가요?"
      options:
        - "새 문서 작성"
        - "기존 문서 수정"
        - "문서 내용 보완"
        - "오타 및 오류 수정"
        - "문서 구조 개선"
    validations:
      required: true

  - type: input
    id: document_name
    attributes:
      label: "문서 이름"
      description: "작업할 문서의 이름을 입력하세요."
      placeholder: "예: README.md, 게임 기획서"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "작업 내용"
      description: "어떤 문서 작업이 필요한지 작성하세요."
      placeholder: |
        - 문서 작성 목적
        - 추가하거나 수정할 내용
        - 필요한 자료
    validations:
      required: true

  - type: textarea
    id: completion
    attributes:
      label: "완료 조건"
      description: "어떤 상태가 되면 작업이 완료되나요?"
      placeholder: |
        - 필요한 내용 작성 완료
        - 팀원 검토 완료
        - 문서 저장소 반영 완료
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "우선순위"
      options:
        - "높음"
        - "보통"
        - "낮음"
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: "참고 자료"
      description: "관련 링크나 참고 문서를 첨부하세요."
    validations:
      required: false
